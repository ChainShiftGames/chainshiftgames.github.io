<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#130b20">
  <meta name="description" content="Chain Shift — independent game developers.">
  <title>Chain Shift</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #130b20;
      --ink-soft: #1d1230;
      --purple: #a875ff;
      --purple-light: #d4b8ff;
      --white: #fbf8ff;
      --muted: #b7a9c9;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(115, 60, 184, .22), transparent 38rem),
        radial-gradient(ellipse at 12% 5%, rgba(168, 117, 255, .10), transparent 27rem),
        var(--ink);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image: linear-gradient(rgba(225, 207, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(225, 207, 255, .07) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 76%);
      animation: grid-drift 26s linear infinite;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image: radial-gradient(circle, rgba(224, 205, 255, .75) 1px, transparent 1.8px);
      background-size: 137px 119px;
      background-position: 13px 9px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 78%);
      animation: particles-drift 34s linear infinite;
    }
    .tech-border {
      position: fixed;
      z-index: 4;
      left: 0;
      width: 100%;
      height: clamp(68px, 12vh, 118px);
      pointer-events: none;
      overflow: hidden;
      opacity: .86;
    }
    .tech-border.top { top: 0; }
    .tech-border.bottom { bottom: 0; transform: rotate(180deg); }
    .tech-border::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 100%;
      background:
        linear-gradient(90deg, transparent 0%, rgba(168,117,255,.08) 14%, transparent 28%, transparent 68%, rgba(168,117,255,.07) 84%, transparent 100%),
        repeating-linear-gradient(90deg, transparent 0 37px, rgba(182,145,255,.18) 37px 38px, transparent 38px 74px);
      clip-path: polygon(0 0,100% 0,100% 57%,94% 57%,91% 84%,77% 84%,74% 66%,26% 66%,23% 84%,9% 84%,6% 57%,0 57%);
      border-bottom: 1px solid rgba(182,145,255,.4);
    }
    .tech-border::after {
      content: "";
      position: absolute;
      left: 3%; right: 3%; top: 19px; height: 28px;
      background: repeating-linear-gradient(90deg, transparent 0 48px, rgba(197,162,255,.65) 48px 51px, transparent 51px 94px);
      clip-path: polygon(0 0,100% 0,100% 100%,80% 100%,78% 45%,22% 45%,20% 100%,0 100%);
      opacity: .6;
      animation: trace-flicker 5s ease-in-out infinite;
    }
    .tech-line {
      position: absolute;
      top: 47px;
      left: -35%;
      width: 24%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e7d7ff, #9c5dff, transparent);
      box-shadow: 0 0 8px rgba(181,132,255,.8);
      animation: scan-line 8s linear infinite;
    }
    .tech-label {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(215,194,255,.65);
      font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .34em;
      white-space: nowrap;
    }
    .tech-corner {
      position: absolute;
      top: 18px;
      width: 56px;
      height: 34px;
      border-top: 1px solid rgba(202,172,255,.65);
    }
    .tech-corner.left { left: 22px; border-left: 1px solid rgba(202,172,255,.65); }
    .tech-corner.right { right: 22px; border-right: 1px solid rgba(202,172,255,.65); }
    .tech-corner::after { content: ""; position: absolute; top: 7px; width: 17px; height: 1px; background: var(--purple-light); }
    .tech-corner.left::after { left: 7px; }
    .tech-corner.right::after { right: 7px; }
    .glow {
      position: fixed;
      width: 34rem;
      height: 34rem;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(127, 64, 212, .13);
      filter: blur(85px);
      pointer-events: none;
      animation: breathe 7s ease-in-out infinite;
    }
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 7vh 6vw 4vh;
    }
    .logo-wrap {
      width: min(78vw, 980px);
      max-height: 72vh;
      position: relative;
      isolation: isolate;
      opacity: 0;
      transform: translateY(14px) scale(.985);
      animation: arrive 1s cubic-bezier(.2,.75,.25,1) .08s forwards;
      filter: drop-shadow(0 18px 60px rgba(112, 54, 190, .22));
    }
    .logo-wrap svg {
      display: block;
      width: 100%;
      max-height: 72vh;
      overflow: visible;
    }
    .logo-wrap svg path, .logo-wrap svg polygon, .logo-wrap svg rect, .logo-wrap svg circle, .logo-wrap svg ellipse {
      fill: #fff !important;
    }
    /* A soft moving sheen glides across the actual logo artwork. */
    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: -8% -10%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(112deg, transparent 38%, rgba(255,255,255,0) 43%, rgba(255,255,255,.58) 49%, rgba(224,201,255,.18) 52%, transparent 59%);
      transform: translateX(-130%);
      mix-blend-mode: screen;
      animation: sheen 1.35s ease-out 1.1s both;
      -webkit-mask-image: linear-gradient(#000, #000);
      mask-image: linear-gradient(#000, #000);
    }
    footer {
      z-index: 2;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 22px 20px 25px;
      margin-bottom: clamp(48px, 7vh, 82px); /* keep links clear of the bottom HUD border */
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s ease, text-shadow .2s ease;
    }
    footer a:hover, footer a:focus-visible {
      color: var(--white);
      text-shadow: 0 0 18px rgba(198, 162, 255, .7);
      outline: none;
    }
    .separator { color: var(--purple); opacity: .8; }
    .footer-label { opacity: .55; }
    @keyframes arrive {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes sheen {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(130%); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .68; transform: translate(-50%, -50%) scale(.94); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes grid-drift { from { background-position: 0 0, 0 0; } to { background-position: 54px 54px, 54px 54px; } }
    @keyframes particles-drift { from { background-position: 13px 9px; } to { background-position: 150px 128px; } }
    @keyframes scan-line { 0% { left: -30%; opacity: 0; } 8% { opacity: .8; } 78% { opacity: .7; } 100% { left: 110%; opacity: 0; } }
    @keyframes trace-flicker { 0%, 100% { opacity: .35; } 50% { opacity: .78; } }
    @media (max-width: 600px) {
      main { padding: 10vh 5vw 8vh; }
      .logo-wrap { width: 92vw; }
      .tech-border { height: 72px; }
      .tech-corner { width: 28px; }
      .tech-corner.left { left: 10px; }
      .tech-corner.right { right: 10px; }
      .tech-label { font-size: 7px; letter-spacing: .2em; top: 13px; }
      footer { gap: 12px; padding: 20px 10px 23px; margin-bottom: 48px; font-size: 9px; letter-spacing: .08em; }
      .footer-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
